<div class="min-h-screen bg-gray-50 flex flex-col">
  @if (isAuthenticated$ | async) {
    <nav class="bg-white border-b border-gray-200 shadow-xs">
      <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
        <div class="flex justify-between h-16">
          <div class="flex items-center space-x-8">
            <div class="flex-shrink-0 flex items-center">
              <span class="text-xl font-bold text-indigo-600">DormMaintenance</span>
            </div>
            <div class="hidden md:flex space-x-4">
              @if ((userRole$ | async) === 'student') {
                <a routerLink="/student" routerLinkActive="bg-indigo-50 text-indigo-700" class="text-gray-600 hover:text-gray-900 px-3 py-2 rounded-md text-sm font-medium">My Reports</a>
              }
              @if ((userRole$ | async) === 'janitor') {
                <a routerLink="/janitor" routerLinkActive="bg-indigo-50 text-indigo-700" class="text-gray-600 hover:text-gray-900 px-3 py-2 rounded-md text-sm font-medium">Job Feed</a>
              }
              @if ((userRole$ | async) === 'admin') {
                <a routerLink="/admin" routerLinkActive="bg-indigo-50 text-indigo-700" class="text-gray-600 hover:text-gray-900 px-3 py-2 rounded-md text-sm font-medium">Admin Dashboard</a>
              }
            </div>
          </div>
          <div class="flex items-center space-x-4">
            @if (currentUser$ | async; as user) {
              <div class="text-right">
                <div class="text-sm font-medium text-gray-900">{{ user.name }}</div>
                <div class="text-xs text-gray-500 capitalize">{{ user.role }}</div>
              </div>
            }
            <button
              (click)="onLogout()"
              class="inline-flex items-center px-3 py-1.5 border border-gray-300 text-xs font-medium rounded-md text-gray-700 bg-white hover:bg-gray-50 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-indigo-500 transition-colors"
            >
              Sign out
            </button>
          </div>
        </div>
      </div>
    </nav>
  }

  <main class="flex-1">
    <router-outlet></router-outlet>
  </main>
</div>
