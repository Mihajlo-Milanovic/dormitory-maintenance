# Development override: runs the frontend with the Angular dev server and live reload.
# Usage: docker compose -f docker-compose.yml -f docker-compose.dev.yml up --build
services:
  frontend:
    build:
      context: ./dormitory-maintenance-frontend
      dockerfile: Dockerfile.dev
    environment:
      - BACKEND_URL=http://backend:3000
    ports: !override
      - "4200:4200"
    volumes:
      # Bind-mount source for live reload (:z relabels for SELinux)
      - ./dormitory-maintenance-frontend:/app:z
      # Keep the container's node_modules and build cache instead of the host's
      - /app/node_modules
      - /app/.angular
