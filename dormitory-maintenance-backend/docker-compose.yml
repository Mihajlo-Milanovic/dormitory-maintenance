version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: dormitory_postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: dormitory_maintenance
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d dormitory_maintenance"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: dormitory_backend
    environment:
      - DATABASE_URL=postgresql://postgres:postgres@postgres:5432/dormitory_maintenance?schema=public
      - JWT_SECRET=super-secret-jwt-key-dormitory-maintenance
      - JWT_REFRESH_SECRET=super-secret-refresh-key-dormitory-maintenance
      - PORT=3000
    ports:
      - "3000:3000"
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

volumes:
  postgres_data:
